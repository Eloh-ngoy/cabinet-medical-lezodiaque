services:
  - type: web
    name: medinexus
    runtime: docker
        value: file
    dockerfilePath: ./Dockerfile
        value: file
    autoDeploy: true
      # Run migrations and other release tasks after the image is deployed
      releaseCommand: "php artisan migrate --force && php artisan db:seed --force && php artisan storage:link || true"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_LOCALE
        value: fr
      - key: APP_NAME
        value: MediNexus
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: medinexus-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

databases:
  - name: medinexus-db
    plan: free
    ipAllowList: []
